# ── Resolution Fitness — Netlify config (free web showcase) ───────────
# Deploys the mobile app as an interactive web demo that anyone can open.
# The web build talks to the production backend on Render via
# extra.backendUrl in app.json.
#
# Usage (drag-and-drop, no build):
#   1) cd mobile && npm run export:web        # produces mobile/dist
#   2) Drag the mobile/dist folder onto Netlify
#
# Usage (git-connected auto-deploy): just push to main — Netlify runs the
# build command below against the repo root.

# The web app lives under mobile/, so run everything relative to it.
[build]
  base = "mobile"
  publish = "dist"
  command = "npm run export:web"

# SPA fallback — every route falls back to index.html for client-side nav.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers for the demo (optional but clean).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"